<header class="masthead" id="masthead">
  <div class="wrap mast-row">
    <div class="brand">
      <span class="date" id="today"></span>
      <h1>Voorpagina<span class="dot">.</span></h1>
    </div>
    <div class="mast-tools">
      <div class="updated" id="updated"></div>
      <button class="icon-btn" id="refresh" type="button" aria-label="Nieuws verversen" title="Verversen"><svg class="i"><use href="#i-refresh"/></svg></button>
    </div>
  </div>
</header>

<main class="wrap" id="view" aria-live="polite">
  <div class="feed skeleton" aria-hidden="true">
    <div class="story"><div class="sk" style="height:180px;border-radius:14px"></div><div class="sk" style="width:90%;height:22px"></div><div class="sk" style="width:70%;height:22px"></div></div>
    <div class="story"><div class="sk" style="width:85%;height:18px"></div><div class="sk" style="width:60%"></div></div>
    <div class="story"><div class="sk" style="width:80%;height:18px"></div><div class="sk" style="width:50%"></div></div>
  </div>
</main>
